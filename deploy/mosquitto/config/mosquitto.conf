# Mosquitto MQTT Broker 配置（局域网使用）
# 放到 ./deploy/mosquitto/config/mosquitto.conf

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# 默认放行局域网匿名连接（Home Assistant 在同一主机/局域网，需能连上）。
# 若要为 broker 启用用户名密码认证，请：
#   1. 生成密码文件并解注释下面几行：
#      docker compose exec mosquitto mosquitto_passwd -c \
#        /mosquitto/config/passwd mqtt_user
#      # 按提示两次输入密码
#   2. 解注释 allow_anonymous 与 password_file
listener 1883
allow_anonymous true
# password_file /mosquitto/config/passwd
# allow_anonymous false

# WebSocket（可选，用作 HA 前端或第三方）
listener 9001
protocol websockets
allow_anonymous true
